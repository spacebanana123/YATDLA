<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - YATDLA</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<div id="toast-container"></div>
	<div class="container">
		<div>
			<h1>Welcome to YATDLA</h1>
			<p>Yet Another To-Do List App</p>
			<form onsubmit="event.preventDefault();">
				<div>
					<label for="username">Username:</label>
					<input type="text" id="username" name="username" class="inputBox" required>
				</div>
				<div>
					<label for="password">Password:</label>
					<input type="password" id="password" name="password" class="inputBox" required>
				</div>
				<div class="auth-buttons">
					<button type="button" class="button" onclick="login()">Login</button>
					<button type="button" class="button" onclick="register()">Register</button>
				</div>
			</form>
		</div>
	</div>
	<script src="/index.js"></script>
</body>
</html>
